<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#2d1b3d">

<title>Mitopía · Mascotas míticas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: tierno y travieso, como un libro ilustrado que cobra vida
   IDEA: un álbum de pegatinas de criaturas míticas: todo con contorno grueso y sombra sólida
   PICTURE: el mundo dibujado en canvas ocupa toda la pantalla; la interfaz flota encima como pegatinas
   COLOUR and TYPE: tinta ciruela #2d1b3d, crema #fff8ef, rosa #ff5fa2, amarillo #ffe066; Baloo 2
   LAYOUT: HUD arriba, barra de mundo abajo, paneles centrales; en celular todo se apila */
:root{color-scheme:light;--ink:#2d1b3d;--cream:#fff8ef;--pink:#ff5fa2;--yel:#ffe066;--sky:#7fd3ff;--mint:#5cc98a;--sh:0 4px 0 var(--ink)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2d1b3d;color:var(--ink);font:600 16px/1.4 "Baloo 2",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.hide{display:none!important}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:max(10px,env(safe-area-inset-top)) 12px 0;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
#hudL{display:flex;flex-direction:column;gap:6px}
#pcard{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:4px 12px 4px 4px;box-shadow:var(--sh);text-align:left}
#pface{width:56px;height:56px;border-radius:14px;background:radial-gradient(circle at 50% 40%,#fff6fb,#ffd6ea);overflow:hidden}#pface svg{width:100%;height:100%}
.pinfo b{display:block;font-size:17px;line-height:1.1}.pinfo span{font-size:13px;opacity:.75}
.xp{width:110px;height:8px;border-radius:6px;background:#eee0f0;border:2px solid var(--ink);overflow:hidden;margin-top:2px}.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--yel),#ffb020)}
#needs{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;background:rgba(255,248,239,.92);border:3px solid var(--ink);border-radius:16px;padding:6px 10px;box-shadow:var(--sh);width:236px}
.nd span{font-size:12px;line-height:1}.bar{height:9px;border-radius:6px;background:#eee0f0;border:2px solid var(--ink);overflow:hidden}.bar i{display:block;height:100%;transition:width .4s}.bar.big{height:16px;margin:6px 0}
.bar.low{animation:blink 1s infinite}@keyframes blink{50%{border-color:#ff4f6d}}
#hudR{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#coins{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:4px 14px 4px 6px;box-shadow:var(--sh);font-size:20px;font-weight:800}
#menu{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:470px}
#menu button{width:54px;height:56px;display:grid;place-items:center;gap:0;padding:4px 0 2px;background:var(--cream);border:3px solid var(--ink);border-radius:16px;box-shadow:var(--sh);transition:transform .1s}
#menu button small{font-size:11px;line-height:1}#menu button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#menu button.on{background:#ff6a3d;color:#fff}
/* barra de mundo */
#wbar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:8px;padding:0 12px max(12px,env(safe-area-inset-bottom));z-index:5;pointer-events:none}
#wbar>*{pointer-events:auto}
#wbar button,#gbar button{display:flex;align-items:center;gap:6px;background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:8px 14px;box-shadow:var(--sh);font-weight:700;min-height:48px}
#wbar .round{width:60px;height:60px;justify-content:center;padding:0;background:var(--yel)}#wbar .fz{background:#ff6a3d;color:#fff}
#quest{flex:1;max-width:520px;background:rgba(255,248,239,.94);border:3px solid var(--ink);border-radius:18px;padding:5px 14px;box-shadow:var(--sh);line-height:1.2}#quest b{display:block;color:var(--pink);font-size:15px}#quest span{font-size:14px}#quest.done b{color:#2f9a5a}
#gemc{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 12px;box-shadow:var(--sh);font-weight:800;display:flex;gap:4px;align-items:center}
#gbar{position:fixed;left:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:5}
/* paneles */
#panel,#gover{position:fixed;inset:0;background:rgba(25,12,45,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px;backdrop-filter:blur(3px)}
.pbox{background:var(--cream) radial-gradient(circle,rgba(255,95,162,.08) 1.5px,transparent 2px) 0 0/22px 22px;border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);width:min(560px,100%);max-height:min(92vh,900px);display:flex;flex-direction:column;animation:pop .28s cubic-bezier(.2,1.6,.5,1)}
.pbox.wide{width:min(1040px,100%)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.pbox header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px 20px;border-bottom:3px dashed rgba(45,27,61,.25)}
.pbox h2{margin:0;font-size:clamp(22px,3vw,30px);font-weight:800;line-height:1.05}
.x{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:26px;line-height:1;box-shadow:0 3px 0 var(--ink)}
.pbody{overflow:auto;padding:14px 18px 20px}
h3{margin:4px 0;font-size:24px;line-height:1.1}h4{margin:14px 0 6px;font-size:17px}
.note{opacity:.85;font-size:15px;margin:6px 0}
.btn{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 16px;box-shadow:0 3px 0 var(--ink);font-weight:700;min-height:44px}
.btn.pri{background:var(--pink);color:#fff}.btn.danger{background:#ff4f4f;color:#fff}.btn.sm{min-height:36px;padding:4px 10px;font-size:14px}.btn.big{font-size:22px;padding:12px 28px}
.btn:active,.card:active{transform:translateY(2px)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row.c{justify-content:center}.mt{margin-top:12px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}.g4{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.g5{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}.g6{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.card{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;box-shadow:0 3px 0 var(--ink);font-size:14px;line-height:1.15}
.card b{font-size:15px}.card small{font-size:12.5px;opacity:.8}.card.on{border-color:var(--pink);background:#fff0f7;box-shadow:0 3px 0 var(--pink)}
.card.locked{opacity:.6}.card.dim .mini{filter:grayscale(.7);opacity:.7}.card img{width:100%;height:auto}
.row-card{flex-direction:row;text-align:left;align-items:center;gap:10px}.row-card .mini{width:110px;flex:none}.row-card b,.row-card small{display:block}.row-card p{margin:4px 0;font-size:14px}
.mini{display:block;width:100%;aspect-ratio:260/250}.mini svg{width:100%;height:100%;display:block}.mini.empty{display:grid;place-items:center;opacity:.5;background:#f4eaf4;border-radius:12px}
.fimg{width:64px;height:64px}.fimg svg{width:100%;height:100%}
.r{font-weight:800;opacity:1!important}.r.Común{color:#7a7090}.r.Raro{color:#2b8ad9}.r.Épico{color:#8a4ad6}.r.Legendario{color:#d98a00}.r.Exclusivo{color:var(--pink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;min-height:40px}.chips button.on{background:var(--pink);color:#fff}.chips.col{flex-direction:column;align-items:flex-start}
.chips.slots button small{opacity:.7}.chips.mats{margin:8px 0 2px}.chips.mats button{min-height:34px;padding:3px 11px;font-size:13.5px}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.sw button{width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);padding:0}.sw button.on{outline:3px solid var(--pink);outline-offset:2px}
.cust{display:flex;align-items:center;gap:4px;font-size:13px}.cust input{width:40px;height:34px;border:3px solid var(--ink);border-radius:10px;padding:0;background:none}
.txt{font:inherit;font-size:18px;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;width:min(320px,100%);background:#fff}
input[type=range]{width:100%;accent-color:var(--pink);height:30px}
/* taller */
.ws{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:18px}
.wsL{position:sticky;top:0;align-self:start}
.stage{background:radial-gradient(circle at 50% 45%,#fff 0,#ffe3f1 55%,#ffc9e2 100%);border:3px solid var(--ink);border-radius:22px;aspect-ratio:1;display:grid;place-items:center;overflow:hidden;position:relative}
.stage svg{width:92%;height:92%;animation:idle 2.6s ease-in-out infinite;transform-origin:50% 90%}.stage.sm{width:180px;margin:0 auto}
@keyframes idle{50%{transform:translateY(-6px) scale(1.02,.98)}}
#wsEx{margin:10px 0}#wsEx button{padding:4px 10px;min-height:36px;font-size:14px}
.wsAct{display:flex;flex-wrap:wrap;gap:6px}.wsAct .pri{flex:1 1 100%}
.cost{font-size:14px;margin:8px 0 0}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.tabs button{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:5px 12px;font-weight:800;min-height:40px}.tabs button.on{background:var(--yel)}
.tabc{max-height:min(62vh,620px);overflow:auto;padding:4px 4px 10px}
.adopt{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:center}
/* casa */
.home{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
.room{position:relative;aspect-ratio:8/5;border:3px solid var(--ink);border-radius:20px;overflow:hidden;touch-action:none}
.room>svg{position:absolute;inset:0;width:100%;height:100%}
.hpet{position:absolute;left:50%;bottom:4%;width:40%;transform:translateX(-50%);cursor:grab}.hpet svg{width:100%;height:auto;animation:idle 2.6s ease-in-out infinite;transform-origin:50% 90%}
.hpet.scrub{cursor:crosshair}.hpet.jump svg{animation:hop .8s cubic-bezier(.3,1.5,.5,1)}
@keyframes hop{30%{transform:translateY(-34%) rotate(-8deg)}60%{transform:translateY(0) scale(1.1,.9)}}
.dark{position:absolute;inset:0;background:rgba(15,10,50,.62);opacity:0;pointer-events:none;transition:opacity .8s}.dark.on{opacity:1}
#hfx{position:absolute;inset:0;pointer-events:none}
.fx{position:absolute;pointer-events:none}.fx.bub{width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(191,239,255,.5);animation:rise 1.4s ease-out forwards}
.fx.heart{width:26px;height:26px;background:var(--pink);clip-path:path('M13 24 C-6 12 2 -2 13 7 C24 -2 32 12 13 24Z');animation:rise 1.2s ease-out forwards}
.fx.food{width:70px;height:70px;margin:-35px;animation:eat .7s ease-in forwards}.fx.food svg{width:100%;height:100%}
.fx.ball{width:44px;height:44px;border-radius:50%;background:conic-gradient(#ff4f5e 0 25%,#fff 0 50%,#4fc3ff 0 75%,#ffe066 0);border:3px solid var(--ink);animation:throw .8s ease-in-out forwards}
@keyframes rise{to{transform:translateY(-90px) scale(1.3);opacity:0}}@keyframes eat{0%{transform:translateY(-40px) scale(1.2)}100%{transform:translateY(30px) scale(.2);opacity:0}}
@keyframes throw{50%{transform:translate(18vw,-120px) rotate(360deg)}100%{transform:translate(28vw,0) rotate(720deg);opacity:0}}
.bigneeds{display:grid;gap:8px}.bigneeds span{font-size:14px}.bigneeds .bar{height:16px}
.hact{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.hact .btn:last-child{grid-column:1/-1}
.hsub p{margin:4px 0}.foods{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.food{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:4px;display:grid;place-items:center}.food svg{width:48px;height:48px}.food small{font-size:11.5px;line-height:1.1}
/* diálogo */
#dialog{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(760px,calc(100% - 20px));z-index:8}
.dl{display:flex;gap:12px;background:var(--cream);border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:10px 14px;animation:pop .25s}
.dl img{width:110px;height:110px;flex:none;background:radial-gradient(#fff,#ffe3f1);border-radius:16px;border:3px solid var(--ink)}
.dt b{font-size:19px}.dt p{margin:2px 0 8px;font-size:16.5px}.dt .btn{min-height:40px;padding:4px 12px}
/* fin de juego / recompensa */
.go{padding:20px;text-align:center;align-items:center}.go .big{font-size:40px;font-weight:800;margin:4px 0}.go h2{color:var(--pink)}
.reward{text-align:center}.reward .stage{width:min(260px,70vw);margin:0 auto 10px}
.photo{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}.photo img{width:100%;border-radius:12px;border:3px solid var(--ink);user-select:auto;-webkit-user-select:auto;-webkit-touch-callout:default}
/* avisos y transiciones */
#toasts{position:fixed;top:max(84px,calc(env(safe-area-inset-top) + 76px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:30;pointer-events:none;width:min(520px,92vw)}
.toast{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px 16px;box-shadow:var(--sh);font-weight:700;text-align:center;animation:pop .3s}.toast.gold{background:var(--yel)}.toast.out{opacity:0;transform:translateY(-10px);transition:.4s}
#fade{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;background:radial-gradient(circle,#fff 0,var(--fc,#fff) 40%,#2d1b3d 100%);transition:opacity .42s}#fade.on{opacity:1}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:41}#flash.on{animation:fl .5s}@keyframes fl{0%{opacity:.9}100%{opacity:0}}
body.fierce #cv{filter:saturate(1.15) contrast(1.04)}
/* portada */
#title{position:fixed;inset:0;z-index:50;overflow:auto;display:grid;place-items:center;padding:20px}
.tbg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 110%,#ff9ec4 0,transparent 55%),linear-gradient(180deg,#2a1f6a 0%,#7c4dd6 45%,#ff8ac0 100%)}
.tbg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,#fff 1px,transparent 1.6px) 0 0/44px 44px;opacity:.35}
.tin{position:relative;text-align:center;max-width:1100px;width:100%;color:#fff}
#title h1{font-size:clamp(64px,13vw,150px);margin:0;line-height:.9;font-weight:800;color:var(--yel);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 10px 0 var(--ink);letter-spacing:1px}
#title h2{font-size:clamp(28px,4vw,42px);margin:0 0 14px;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
.sub{font-size:clamp(20px,3vw,28px);margin:6px 0 10px;font-weight:700;text-shadow:0 2px 0 var(--ink)}
.parade{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:0;margin:10px auto 18px;max-width:1000px}
.parade span{animation:bob 1.6s ease-in-out infinite;animation-delay:var(--d)}.parade svg{width:100%;height:auto;display:block}
@keyframes bob{50%{transform:translateY(-14px)}}
.foot{opacity:.9;margin-top:14px;text-shadow:0 2px 0 var(--ink)}
.pick .card{color:var(--ink)}.adopt.light{background:var(--cream);color:var(--ink);border:4px solid var(--ink);border-radius:26px;padding:18px;text-align:left;box-shadow:0 8px 0 var(--ink)}.adopt.light h2{-webkit-text-stroke:0;color:var(--ink)}.sub2{opacity:.8;margin:0}.adopt label{display:grid;gap:4px;margin:10px 0}
@media (max-width:600px){#menu{max-width:182px;gap:5px}#menu button{width:40px;height:40px;border-radius:12px;padding:0}#menu button svg{width:19px;height:19px}#needs{width:154px;gap:3px 6px}.nd span{font-size:10px}#pcard{padding-right:8px}.pinfo b{font-size:14px;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#coins{font-size:17px;padding:2px 10px 2px 4px}}
@media (max-width:820px){
 .ws,.home,.adopt,.photo{grid-template-columns:1fr}.wsL{position:static}.ws .stage{max-width:230px;margin:0 auto}.tabc{max-height:none}
 #menu{max-width:240px}#menu button{width:46px;height:46px;border-radius:14px}#menu button small{display:none}
 #needs{width:180px;padding:4px 8px}.nd span{font-size:11px}.xp{width:84px}#pface{width:46px;height:46px}.pinfo b{font-size:15px}
 #wbar{flex-wrap:wrap}#quest{order:-1;flex:1 1 100%;max-width:none}#wbar button span{display:none}#wbar button{padding:8px 12px}
 .parade{grid-template-columns:repeat(5,minmax(0,1fr))}.dl img{width:70px;height:70px}#dialog{bottom:calc(132px + env(safe-area-inset-bottom))}
 .pbox{max-height:96vh}.pbody{padding:10px 12px 16px}
}

/* ===== v4: tipografía, pergamino y madera ===== */
:root{--wood:#a8642e;--wood2:#7a4420;--parch:#fff3d9;--parch2:#f6e2b8;--tz:1}
h1,h2,h3,h4,.pbox h2,#title h1,.tabs button,.btn.big{font-family:"Fredoka","Baloo 2",system-ui,sans-serif;letter-spacing:.2px}
.pbox{background:radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.7),transparent 60%),radial-gradient(circle,rgba(168,100,46,.08) 1.4px,transparent 2px) 0 0/20px 20px,linear-gradient(180deg,var(--parch),var(--parch2));border:5px solid var(--wood2);box-shadow:0 0 0 3px #e0a86a inset,0 8px 0 var(--ink);zoom:var(--tz)}
.pbox header{background:linear-gradient(180deg,#c47a3a,var(--wood) 55%,#94521f);border-radius:20px 20px 0 0;border-bottom:4px solid var(--wood2);padding:10px 14px 10px 20px;position:relative}
.pbox header::before,.pbox header::after{content:"";position:absolute;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#ffd08a;border:2px solid var(--wood2)}.pbox header::before{left:6px}.pbox header::after{right:62px}
.pbox header h2{color:#fff8e6;text-shadow:0 2px 0 var(--wood2),0 0 1px var(--ink);-webkit-text-stroke:1px var(--wood2)}
.pbox .x{background:#fff3d9;border-color:var(--wood2)}
.tabs button{background:#fff8ea;border-color:var(--wood2)}.tabs button.on{background:var(--yel);border-color:var(--ink)}
.card{background:#fffdf7}
#hud,#wbar,#dialog,#gbar{zoom:var(--tz)}
/* menú ilustrado y cajón */
#menu{position:relative}
#menu button{background:linear-gradient(180deg,#fffdf6,#ffeccb);color:var(--ink)}
#menu button svg{filter:drop-shadow(0 1px 0 rgba(45,27,61,.25))}
#menu button.on{background:linear-gradient(180deg,#ffb36a,#ff7a3d)}
#menu button.badge::after,#evb.badge::after,[data-m=amigos].badge::after{content:"";position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:#ff3d6e;border:3px solid var(--ink);animation:ping 1.2s infinite}
#menu button{position:relative}
@keyframes ping{50%{transform:scale(1.25)}}
#drawer{position:absolute;top:calc(100% + 8px);right:0;display:grid;grid-template-columns:repeat(3,96px);gap:6px;padding:10px;background:linear-gradient(180deg,var(--parch),var(--parch2));border:4px solid var(--wood2);border-radius:20px;box-shadow:0 6px 0 var(--ink);z-index:9;animation:pop .22s}
#drawer button{width:auto;height:auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;font-size:13px;line-height:1.1}
#cloud{align-self:flex-start;font-size:12px;font-weight:700;background:rgba(255,248,239,.9);border:2px solid var(--ink);border-radius:999px;padding:1px 10px;opacity:.85}#cloud.on{background:#d9f7e6}
#evb{align-self:flex-start;display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:linear-gradient(90deg,#ffcf3f,#ff9ec4);border:3px solid var(--ink);border-radius:14px;padding:3px 12px;box-shadow:var(--sh);line-height:1.1}#evb b{font-size:14px}#evb span{font-size:12px}
.evb{display:flex;flex-direction:column;background:linear-gradient(90deg,#fff1b8,#ffd6ea);border:3px solid var(--ink);border-radius:16px;padding:8px 14px;margin:4px 0 10px}.evb.big b{font-size:20px}
#wx{background:rgba(255,248,239,.94);border:3px solid var(--ink);border-radius:16px;padding:3px 12px;box-shadow:var(--sh);line-height:1.15;display:flex;flex-direction:column}#wx:empty{display:none}#wx b{font-size:14px}#wx span{font-size:12px;opacity:.8}
/* misiones, clasificación, medallas, diario */
.mis{display:flex;align-items:center;gap:12px;background:#fffdf7;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;margin:6px 0;box-shadow:0 3px 0 var(--ink)}.mis>div{flex:1}.mis.done{opacity:.6}.mis .ok{font-weight:800;color:#2f9a5a}
.btn:disabled{opacity:.45;cursor:default}
table.rk{width:100%;border-collapse:separate;border-spacing:0 4px}.rk th{text-align:left;font-size:13px;opacity:.7;padding:0 8px}.rk td{background:#fffdf7;padding:6px 8px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}.rk td:first-child{border-left:2px solid var(--ink);border-radius:10px 0 0 10px;font-weight:800}.rk td:last-child{border-right:2px solid var(--ink);border-radius:0 10px 10px 0;font-weight:800}.rk tr.me td{background:#ffe9f3}
.medals{display:flex;gap:4px;flex:none}.med{width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);opacity:.25;background:#ccc}.med.got{opacity:1}.med.m0{background:radial-gradient(circle at 35% 30%,#f0b27a,#cd7f32)}.med.m1{background:radial-gradient(circle at 35% 30%,#fff,#b8c4d6)}.med.m2{background:radial-gradient(circle at 35% 30%,#fff6b0,#ffcf3f)}
.diary h4{text-transform:capitalize;color:var(--wood2)}.dent{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:2px dashed rgba(122,68,32,.25)}.dent span:nth-child(2){flex:1}.dent small{opacity:.6}
.bars .br{display:grid;grid-template-columns:50px 1fr 36px;gap:8px;align-items:center}
/* casa decorada */
.swb{display:block;width:100%;height:42px;border-radius:10px;border:2px solid var(--ink)}.fpv{width:100%;height:70px}.grid.sm{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-top:8px}
.hcomp{position:absolute;left:-26%;top:4%;width:30%;animation:bob 1.8s ease-in-out infinite}.hcomp svg{width:100%;height:auto;animation:none}
.home>.room{position:sticky;top:0;align-self:start;z-index:2}@media (max-width:820px){.home>.room{position:relative}}
.hact .btn.deco{grid-column:1/-1;background:#fff1b8}
/* foto */
.stk{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.stk button{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:2px;aspect-ratio:1}.stk button.on{background:#ffe9f3;border-color:var(--pink)}.stk canvas{width:100%;height:100%}
.phw img{cursor:crosshair}#panel.peek{opacity:0;transition:none}
/* animaciones de cuerpo y accesorios en paneles */
.anim svg .acc-aura,.stage svg .acc-aura,.hpet svg .acc-aura{animation:aura 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.stage svg .acc-espalda,.hpet svg .acc-espalda,.mini svg .acc-espalda{animation:flap 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 20%}
@keyframes aura{50%{opacity:.7;transform:scale(1.06)}}@keyframes flap{50%{transform:rotate(-4deg) scaleX(1.04)}}
.stage.anim svg{animation:breathe 3s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:translateY(-4px) scale(1.015,.985)}}
/* transiciones de portal */
#fade[data-p]:not([data-p=fundido]).on{animation:portal .42s ease-in both}
@keyframes portal{from{clip-path:circle(0% at 50% 50%);opacity:1}to{clip-path:circle(150% at 50% 50%);opacity:1}}
#fade[data-p=diamante].on{animation-name:pdia}@keyframes pdia{from{clip-path:polygon(50% 50%,50% 50%,50% 50%,50% 50%);opacity:1}to{clip-path:polygon(50% -60%,160% 50%,50% 160%,-60% 50%);opacity:1}}
#fade[data-p=paginas].on,#fade[data-p=nubes].on{animation-name:pwipe}@keyframes pwipe{from{clip-path:inset(0 100% 0 0);opacity:1}to{clip-path:inset(0 0 0 0);opacity:1}}
#fade[data-p=pixel].on{animation:pixel .42s steps(6) both}@keyframes pixel{from{clip-path:inset(50% 50% 50% 50%);opacity:1}to{clip-path:inset(0);opacity:1}}
#fade[data-p=corazon].on{animation-name:pheart}@keyframes pheart{from{clip-path:circle(0% at 50% 60%);opacity:1}to{clip-path:circle(140% at 50% 60%);opacity:1}}
#fade[data-p=estrellas]{background:radial-gradient(circle,#fff 1.5px,transparent 2px) 0 0/34px 34px,radial-gradient(circle,#fff6b0 0,var(--fc,#ff5fa2) 45%,#1d1b4f 100%)}
#fade[data-p=burbujas]{background:radial-gradient(circle,rgba(255,255,255,.7) 6px,transparent 7px) 0 0/48px 48px,radial-gradient(circle,#bfefff 0,#3fb6d9 50%,#0e4a7a 100%)}
#fade[data-p=llamas]{background:radial-gradient(circle,#fff3b0 0,#ff8a1a 45%,#5a1a0a 100%)}
#fade[data-p=hojas]{background:radial-gradient(ellipse,rgba(255,255,255,.35) 5px,transparent 7px) 0 0/40px 30px,radial-gradient(circle,#eaffc8 0,#5cc98a 45%,#1f4a2a 100%)}
#fade[data-p=copos]{background:radial-gradient(circle,#fff 2px,transparent 3px) 0 0/30px 30px,radial-gradient(circle,#fff 0,#bfefff 50%,#3a5a8a 100%)}
#fade[data-p=niebla]{background:radial-gradient(circle,#e6f0ea 0,#8aa89a 55%,#1f2a2a 100%)}
#fade[data-p=petalos]{background:radial-gradient(circle,#ffb43a 4px,transparent 5px) 0 0/38px 38px,radial-gradient(circle,#ffe0b0 0,#ff7a3d 45%,#3a1a4a 100%)}
#fade[data-p=engrane]{background:repeating-conic-gradient(#c98a4a 0 10deg,#a86a33 10deg 20deg)}
/* postal del globo */
#postal{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,30px);z-index:7;opacity:0;transition:opacity .35s,transform .35s;pointer-events:none}

.pc-in{display:flex;gap:12px;align-items:center;background:linear-gradient(180deg,var(--parch),var(--parch2));border:4px solid var(--wood2);border-radius:20px;padding:10px 16px 10px 10px;box-shadow:0 6px 0 var(--ink);width:min(440px,92vw)}

.pc-in small{opacity:.7;font-size:12px}.pc-in b{display:block;font-family:Fredoka,sans-serif;font-size:21px;line-height:1.1}.pc-in span{display:block;font-size:13px;line-height:1.2}
/* tutorial con Lumi */
#tut{position:fixed;inset:0;z-index:45}#tut.dim{background:rgba(20,10,40,.62)}
#tutHole{position:fixed;border-radius:18px;box-shadow:0 0 0 9999px rgba(20,10,40,.62);border:3px dashed #ffe066;transition:all .35s;pointer-events:none}
#tutBox{position:fixed;width:min(320px,calc(100vw - 24px));background:linear-gradient(180deg,var(--parch),var(--parch2));border:4px solid var(--wood2);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:14px 14px 10px 78px;transition:top .35s,left .35s;zoom:var(--tz)}
#tutBox p{margin:0 0 8px}#tutBox small{opacity:.6}.tutlumi{position:absolute;left:8px;top:8px;width:64px;height:64px;animation:bob 1.6s ease-in-out infinite;}.tutlumi svg{width:100%;height:100%}

#rest{position:fixed;inset:0;z-index:55;background:rgba(20,15,60,.86);display:grid;place-items:center;padding:12px}

#fxc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

#loader{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 120%,#ff9ec4,transparent 60%),linear-gradient(180deg,#1d1856,#5a3ab0 60%,#ff8ac0);transition:opacity .6s}

#loader .ld{text-align:center;color:#fff}#loader svg{width:min(260px,60vw);height:auto}
#loader h1{font-family:Fredoka,"Baloo 2",sans-serif;font-size:clamp(46px,9vw,84px);margin:0;color:var(--yel);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
#loader p{margin:4px 0 12px;font-weight:700;text-shadow:0 2px 0 var(--ink)}
.ldbar{width:min(300px,70vw);height:18px;margin:0 auto;border:3px solid var(--ink);border-radius:12px;background:#fff3d9;overflow:hidden}.ldbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,#ff5fa2 0 10px,#ff8ac0 10px 20px);transition:width .3s}

body.hc{--ink:#000}body.hc .card,body.hc .pbox,body.hc .chips button,body.hc .btn{border-color:#000}body.hc .note,body.hc .card small{opacity:1}body.hc #cv{filter:contrast(1.25) saturate(1.1)}body.hc .pbox{background:#fffef8}body.hc .btn.pri,body.hc .chips button.on{background:#c2185b}

:focus-visible{outline:3px solid var(--pink)!important;outline-offset:2px}

@media (min-width:821px) and (max-width:1180px){
 #panel{justify-content:flex-end;padding:10px}#panel .pbox.wide{width:min(760px,74vw);height:calc(100vh - 20px);max-height:none;animation:slide .28s ease-out}
 @keyframes slide{from{transform:translateX(60px);opacity:0}}
 .ws{grid-template-columns:minmax(0,260px) minmax(0,1fr)}.home{grid-template-columns:1fr}
 #menu{max-width:240px}#menu button{width:52px;height:54px}
}
@media (max-width:600px){#drawer{grid-template-columns:repeat(3,84px);right:-4px}#cloud{font-size:10px}#evb span{display:none}.stk{grid-template-columns:repeat(4,1fr)}.pc-img{width:90px;height:70px}}
@media (max-width:820px){#menu{max-width:200px}}

/* ===== v5: acceso, avisos y centro de mando ===== */

.abox{position:relative;width:min(440px,100%);background:linear-gradient(180deg,var(--parch),var(--parch2));border:5px solid var(--wood2);border-radius:26px;box-shadow:0 0 0 3px #e0a86a inset,0 10px 0 var(--ink);padding:18px 22px 20px;display:flex;flex-direction:column;gap:8px;zoom:var(--tz);animation:pop .3s}
.alogo{display:flex;align-items:center;justify-content:center;gap:8px;margin:-4px 0 2px}.alogo h1{margin:0;font-family:Fredoka,"Baloo 2",sans-serif;font-size:42px;color:var(--yel);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.alumi{width:54px;height:54px;animation:bob 1.8s ease-in-out infinite}.alumi svg{width:100%;height:100%}

.abox .txt{width:100%}.abox .txt[readonly]{background:#efe6d2;color:#5a4a3a}.txt.code{font-size:28px;letter-spacing:10px;text-align:center;font-weight:800}
.lbl{font-weight:700;margin-top:4px}.chk{display:flex;gap:8px;align-items:flex-start;font-weight:600;line-height:1.25;cursor:pointer}.chk input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--pink)}
.rules{background:#fffdf7;border:2px dashed var(--wood2);border-radius:12px;padding:6px 10px}.rules summary{cursor:pointer;font-weight:700}.rules ul{margin:6px 0 0;padding-left:20px}
.amsg{min-height:20px;font-weight:700;font-size:14px}.amsg.dev{background:#fff1b8;border:2px dashed #e3a21a;border-radius:12px;padding:6px 10px;color:#5a3416}.amsg.err{color:#c2185b}.amsg.ok{color:#2f9a5a}
.btn.link{background:none;border:none;box-shadow:none;text-decoration:underline;padding:2px;color:var(--wood2)}
.acard{display:flex;flex-direction:column;align-items:center;background:#fffdf7;border:3px solid var(--ink);border-radius:16px;padding:10px;box-shadow:0 3px 0 var(--ink)}.acard b{font-size:22px;font-family:Fredoka,sans-serif}.acard span{opacity:.75;word-break:break-all}
.aspin{width:46px;height:46px;margin:10px auto;border-radius:50%;border:6px solid #f6e2b8;border-top-color:var(--pink);animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#anuncio{position:fixed;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:8;display:flex;gap:10px;align-items:center;max-width:min(560px,92vw);background:linear-gradient(90deg,#fff1b8,#ffd6ea);border:3px solid var(--ink);border-radius:16px;padding:6px 8px 6px 14px;box-shadow:var(--sh);font-weight:700;zoom:var(--tz)}
#anuncio button{background:#fff;border:2px solid var(--ink);border-radius:50%;width:28px;height:28px;font-weight:800;flex:none}
.pbox.admin{background:linear-gradient(180deg,#24203a,#1a1730);color:#f2ecff;border-color:#0d0b1a;box-shadow:0 0 0 3px #5a4fb0 inset,0 8px 0 #000}
.pbox.admin header{background:linear-gradient(180deg,#5a4fb0,#3a3080);border-bottom-color:#0d0b1a}.pbox.admin header h2{-webkit-text-stroke:0;text-shadow:0 2px 0 #0d0b1a}
.pbox.admin .note,.pbox.admin small{color:#c9c2e8;opacity:1}.pbox.admin .tabs button{background:#2e2950;color:#f2ecff;border-color:#0d0b1a}.pbox.admin .tabs button.on{background:#ffcf3f;color:#2d1b3d}
.pbox.admin .txt{background:#120f24;color:#fff;border-color:#5a4fb0}.pbox.admin .rk td{background:#2a2548;color:#fff;border-color:#0d0b1a}.pbox.admin h4{color:#ffcf3f}
.admbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.admtag{background:#ff3d6e;color:#fff;border-radius:999px;padding:2px 10px;font-weight:800;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.kpi{background:#2e2950;border:2px solid #5a4fb0;border-radius:14px;padding:10px;display:flex;flex-direction:column}.kpi b{font-size:24px;font-family:Fredoka,sans-serif;color:#ffe066;word-break:break-word}.kpi span{font-size:13px;color:#c9c2e8}

.gbox{width:100%}.gbox .txt{flex:1;min-width:90px}
.pill{border-radius:999px;padding:0 8px;font-size:12px;font-weight:800}.pill.red{background:#ff3d6e;color:#fff}
.admgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.errlog{background:#120f24;border-radius:12px;padding:8px;max-height:220px;overflow:auto;font-family:ui-monospace,monospace;font-size:12px}.errlog div{border-bottom:1px solid #2e2950;padding:3px 0}
.pbox.admin .btn{color:#2d1b3d}.pbox.admin .btn.danger{color:#fff}
.btn.danger{background:#ff3d6e;color:#fff}

.pside{overflow:auto;padding:14px 16px 18px}
.pnow{display:flex;flex-direction:column;background:#fffdf7;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;margin-bottom:6px}.pnow b{font-family:Fredoka,sans-serif;font-size:20px}.pnow span{opacity:.8}

const OUT='#2a1830';
const hx=h=>{h=h.replace('#','');if(h.length<6)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]};
const toHex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const shade=(h,a)=>{const[r,g,b]=hx(h);return a<0?toHex(r*(1+a),g*(1+a),b*(1+a)):toHex(r+(255-r)*a,g+(255-g)*a,b+(255-b)*a)};
const mixc=(a,b,t)=>{const A=hx(a),B=hx(b);return toHex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t)};

const flat=x=>/stroke|opacity/.test(x||'');
const P=(d,f,x='')=>isHex(f)&&!flat(x)?toon('path',`d="${d}"`,f,3,x):`<path d="${d}" fill="${f}" ${SW} ${x}/>`;
const Pn=(d,f,x='')=>`<path d="${d}" fill="${f}" ${x}/>`;
const L=(d,c=OUT,w=2.6,x='')=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${x}/>`;
const C=(x,y,r,f,s=1,ex='')=>{x=(+x).toFixed(1);y=(+y).toFixed(1);if(s&&isHex(f)&&!flat(ex)&&r>=2.5)return toon('circle',`cx="${x}" cy="${y}" r="${r}"`,f,Math.min(5,Math.max(.8,r*.2)),ex,r>5?`<ellipse cx="${(x-r*.38).toFixed(1)}" cy="${(y-r*.42).toFixed(1)}" rx="${(r*.3).toFixed(1)}" ry="${(r*.2).toFixed(1)}" fill="#fff" opacity=".55" transform="rotate(-30 ${(x-r*.38).toFixed(1)} ${(y-r*.42).toFixed(1)})"/>`:'');return `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${s?SW:''} ${ex}/>`};
const E=(x,y,rx,ry,f,s=1,ex='')=>s&&isHex(f)&&!flat(ex)&&Math.min(rx,ry)>=2.5?toon('ellipse',`cx="${x}" cy="${y}" rx="${rx}" ry="${ry}"`,f,Math.min(5,Math.max(.8,Math.min(rx,ry)*.2)),ex):`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}" ${s?SW:''} ${ex}/>`;
const R=(x,y,w,h,rx,f,s=1,ex='')=>s&&isHex(f)&&!flat(ex)&&Math.min(w,h)>=5?toon('rect',`x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"`,f,Math.min(5,Math.min(w,h)*.14),ex):`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}" ${s?SW:''} ${ex}/>`;

const starD=(cx,cy,r,ri=r*.45,n=5,rot=-90)=>{let d='';for(let i=0;i<n*2;i++){const a=(rot+i*180/n)*Math.PI/180,Rr=i%2?ri:r;d+=(i?'L':'M')+(cx+Math.cos(a)*Rr).toFixed(1)+' '+(cy+Math.sin(a)*Rr).toFixed(1)}return d+'Z'};
const heartD=(x,y,s)=>`M${x} ${y+s*.9} C${x-s*1.6} ${y-s*.1} ${x-s*.9} ${y-s*1.25} ${x} ${y-s*.4} C${x+s*.9} ${y-s*1.25} ${x+s*1.6} ${y-s*.1} ${x} ${y+s*.9}Z`;
const ep=(cx,cy,rx,ry)=>`M${cx-rx} ${cy}a${rx} ${ry} 0 1 0 ${2*rx} 0a${rx} ${ry} 0 1 0 ${-2*rx} 0Z`;

function mirrorD(d){const t=d.match(/[A-Za-z]|-?\d*\.?\d+(?:e-?\d+)?/g);let out='',cmd='',i=0,k=0;const n=()=>+t[i++];
 while(i<t.length){const tok=t[i];if(/[A-Za-z]/.test(tok)){cmd=tok;out+=cmd;i++;k=0;continue}const up=cmd===cmd.toUpperCase(),C=cmd.toUpperCase();
  if(C==='A'){const rx=n(),ry=n(),rot=n(),la=n(),sw=n(),x=n(),y=n();out+=` ${rx} ${ry} ${-rot} ${la} ${1-sw} ${up?200-x:-x} ${y}`}
  else if(C==='H'){const x=n();out+=` ${up?200-x:-x}`}else if(C==='V'){out+=` ${n()}`}
  else{const x=n(),y=n();out+=` ${(up?200-x:-x).toFixed(1)} ${y}`}}return out}
const rotEll=(cx,cy,rx,ry,deg)=>{const a=deg*Math.PI/180;let d='';for(let i=0;i<=32;i++){const t=i/32*Math.PI*2,x=Math.cos(t)*rx,y=Math.sin(t)*ry;d+=(i?'L':'M')+(cx+x*Math.cos(a)-y*Math.sin(a)).toFixed(1)+' '+(cy+x*Math.sin(a)+y*Math.cos(a)).toFixed(1)}return d+'Z'};
const petal=(cx,cy,ang,len,w)=>{const a=ang*Math.PI/180,tx=cx+Math.sin(a)*len,ty=cy-Math.cos(a)*len,px=Math.cos(a)*w,py=Math.sin(a)*w,mx=(cx+tx)/2,my=(cy+ty)/2;return `M${cx} ${cy} Q${(mx+px).toFixed(1)} ${(my+py).toFixed(1)} ${tx.toFixed(1)} ${ty.toFixed(1)} Q${(mx-px).toFixed(1)} ${(my-py).toFixed(1)} ${cx} ${cy}Z`};
const gear=(cx,cy,r1,r2,n,hole)=>{let d='';for(let i=0;i<n*4;i++){const a=i/(n*4)*Math.PI*2,r=(i%4<2)?r1:r2;d+=(i?'L':'M')+(cx+Math.cos(a)*r).toFixed(1)+' '+(cy+Math.sin(a)*r).toFixed(1)}return d+'Z'+(hole?ep(cx,cy,hole,hole).replace(/^M/,' M'):'')};
const dropD=(x,y,s)=>`M${x} ${y-s} Q${x+s*.75} ${y} ${x} ${y+s*.6} Q${x-s*.75} ${y} ${x} ${y-s}Z`;
const cloudD=(x,y,s)=>`M${x-s} ${y} Q${x-s*1.2} ${y-s*.5} ${x-s*.6} ${y-s*.6} Q${x-s*.5} ${y-s*1.2} ${x} ${y-s*.9} Q${x+s*.5} ${y-s*1.3} ${x+s*.7} ${y-s*.55} Q${x+s*1.25} ${y-s*.45} ${x+s} ${y}Z`;
const ap=(n,x0,x1,yb,h)=>[...Array(n)].map((_,i)=>{const t=i/(n-1);return[x0+(x1-x0)*t,yb-h*Math.sin(t*Math.PI)]});

 s+=B.m.map(d=>`<path d="${d}" fill="${M.dark}" fill-rule="evenodd"/>`).join('');
 s+=`<g clip-path="url(#${i}c)">${B.m.map(d=>`<path d="${d}" fill="url(#${i}m)" fill-rule="evenodd" transform="translate(-2.5 -2)"/>`).join('')}${M.over(i)}</g>`;
 s+=B.m.map(d=>`<path d="${d}" fill="none" stroke="${M.st}" stroke-width="2.4" stroke-linejoin="${M.join||'round'}" fill-rule="evenodd"/>`).join('');
 s+=(B.a||[]).filter(Boolean).map(d=>`<path d="${d}" fill="${M.acc}" stroke="${M.st}" stroke-width="2" stroke-linejoin="round" fill-rule="evenodd"/>`).join('');
 s+=(B.l||[]).map(d=>`<path d="${d}" fill="none" stroke="${M.st}" stroke-width="2" stroke-linecap="round" opacity=".75"/>`).join('');
 return s+(M.post?M.post(B):'')}

const AU={ctx:null,
 init(){if(this.ctx)return;try{const c=new(window.AudioContext||window.webkitAudioContext)();this.ctx=c;this.m=c.createGain();this.m.gain.value=.8;this.m.connect(c.destination);
  this.mg=c.createGain();this.sg=c.createGain();this.mg.connect(this.m);this.sg.connect(this.m);this.apply();
  const len=c.sampleRate;this.nb=c.createBuffer(1,len,c.sampleRate);const d=this.nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const dl=c.createDelay();dl.delayTime.value=.28;const fb=c.createGain();fb.gain.value=.28;this.mg.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(this.m);
  if(this.want)this.music(this.want)}catch(e){this.ctx=null}},

 ascenso:{name:'Puente de bambú',help:'Mantén presionado para hacer crecer el bambú y suelta para tender el puente. Si cae en la marca roja, ¡doble puntaje!',
  init(g){g.lives=1;g.gy=g.gh*.66;g.off=0;g.p=[{x:60,w:90}];this.next(g);g.len=0;g.ang=-Math.PI/2;g.state='idle';g.px=g.p[0].x+g.p[0].w-24;g.hold=false},

  update(g,dt){const hold=G.down||G.keys[' '];const cur=g.p[g.p.length-2],nx=g.p[g.p.length-1],sx=cur.x+cur.w;

 vagoneta:{name:'Rompe-rocas',dur:40,help:'Toca las rocas para romperlas antes de que se escondan. Las rocas de oro necesitan más golpes pero dan muchas gemas.',

 coco:{name:'Ritmo de tambores',dur:50,help:'Toca el tambor de cada carril (o teclas 1, 2 y 3) justo cuando el coco llegue a la línea. ¡Haz combos!',

const FGK={bosque:'hojas',selva:'hojas',jade:'bambu',pantano:'juncos',jurasico:'helechos',sabana:'pasto',arrecife:'coral',pirata:'barriles',volcan:'rocas',desierto:'cactus',olimpo:'nubes',nieve:'nieve',neon:'cables',engranes:'engranes',cristal:'cristales',espacio:'cristales',dulce:'dulces',mictlan:'flores',juguetes:'bloques',biblioteca:'libros'};
const SHINE={arrecife:'agua',pirata:'agua',cristal:'cristal',espacio:'cristal',neon:'neon',nieve:'hielo',dulce:'cristal',biblioteca:'polvo',mictlan:'polvo',jade:'agua'};
function fgItem(c,k,x,y,s,i,col){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle=col;c.strokeStyle='rgba(20,10,30,.55)';c.lineWidth=3;
 const blob=(w,h)=>{c.beginPath();c.ellipse(0,0,w,h,0,Math.PI,0);c.fill()};
 switch(k){
  case'hojas':case'helechos':case'bambu':for(let j=-3;j<=3;j++){c.save();c.rotate(j*.32-Math.PI/2);c.beginPath();c.ellipse(70,0,k==='bambu'?60:74,k==='helechos'?12:20,0,0,7);c.fill();c.restore()}if(k==='bambu'){c.fillRect(-60,-140,14,140);c.fillRect(40,-120,12,120)}break;
  case'juncos':case'pasto':for(let j=0;j<9;j++){c.beginPath();c.moveTo(-60+j*15,0);c.quadraticCurveTo(-64+j*15+Math.sin(G.t*1.5+j)*8,-60,-50+j*15+(j%3-1)*14,-90-(j%4)*14);c.lineTo(-54+j*15,0);c.fill()}if(k==='juncos')for(let j=0;j<3;j++){c.fillRect(-40+j*36,-120-j*10,10,34)}break;
  case'coral':for(let j=0;j<5;j++){c.save();c.rotate((j-2)*.35);c.fillRect(-7,-110+j*6,14,110-j*6);c.beginPath();c.arc(0,-110+j*6,14,0,7);c.fill();c.restore()}c.beginPath();c.moveTo(70,0);c.quadraticCurveTo(60+Math.sin(G.t*2)*14,-80,84,-160);c.lineTo(94,-160);c.quadraticCurveTo(76,-80,86,0);c.fill();break;
  case'barriles':c.fillRect(-50,-90,70,90);c.fillRect(30,-60,50,60);c.fillStyle='rgba(255,255,255,.08)';c.fillRect(-50,-70,70,8);c.fillRect(-50,-30,70,8);break;
  case'rocas':case'nieve':blob(80,70);c.beginPath();c.ellipse(70,0,50,44,0,Math.PI,0);c.fill();if(k==='nieve'){c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.ellipse(-10,-62,46,12,0,0,7);c.fill()}break;
  case'cactus':c.fillRect(-14,-130,28,130);c.beginPath();c.arc(0,-130,14,0,7);c.fill();c.fillRect(-50,-80,40,16);c.fillRect(-50,-110,16,46);c.fillRect(14,-60,40,16);c.fillRect(40,-96,16,50);break;
  case'nubes':for(let j=0;j<4;j++){c.beginPath();c.arc(-60+j*40,-20-(j%2)*20,40,0,7);c.fill()}break;
  case'cables':c.lineWidth=14;c.strokeStyle=col;c.beginPath();c.moveTo(-120,-20);c.quadraticCurveTo(0,-140,120,-30);c.stroke();c.lineWidth=8;c.beginPath();c.moveTo(-80,0);c.quadraticCurveTo(20,-80,90,0);c.stroke();break;
  case'engranes':for(const[gx,gy,r]of[[-30,-50,56],[56,-20,34]]){c.save();c.translate(gx,gy);c.rotate(G.t*(r>40?.4:-.66));c.beginPath();for(let k2=0;k2<24;k2++){const a=k2/24*Math.PI*2,R=k2%2?r:r+12;c.lineTo(Math.cos(a)*R,Math.sin(a)*R)}c.fill();c.restore()}break;
  case'cristales':for(let j=0;j<4;j++){c.save();c.translate(-50+j*34,0);c.rotate((j-1.5)*.22);c.beginPath();c.moveTo(-14,0);c.lineTo(-14,-60-j*16);c.lineTo(0,-84-j*16);c.lineTo(14,-60-j*16);c.lineTo(14,0);c.fill();c.restore()}break;
  case'dulces':c.fillRect(-4,-130,8,130);c.beginPath();c.arc(0,-136,30,0,7);c.fill();c.lineWidth=10;c.strokeStyle=col;c.beginPath();c.moveTo(60,0);c.lineTo(60,-90);c.arc(80,-90,20,Math.PI,0);c.stroke();break;
  case'flores':for(let j=0;j<5;j++){const fx=-60+j*30,fy=-50-(j%2)*30;c.fillRect(fx-2,fy,4,-fy);c.beginPath();c.arc(fx,fy,16,0,7);c.fill()}break;
  case'bloques':c.fillRect(-60,-50,50,50);c.fillRect(-4,-50,50,50);c.fillRect(-34,-100,50,50);break;
  case'libros':for(let j=0;j<6;j++){c.fillRect(-60+(j%2)*8,-j*20-20,120-j*6,18)}break;
 }c.restore()}
const _wdraw=WSC.draw;WSC.draw=function(c){_wdraw.call(this,c);worldOver(c,this)};
function worldOver(c,S){const w=S.w,t=G.t,rm=document.body.classList.contains('rm');
 // primer plano con parallax
 const k=FGK[w.id];if(k){c.save();c.scale(S.s,S.s);c.translate(0,S.oy);const base=S.bot+8,par=S.cam*1.35,col=shade(w.ground||'#5a8a4a',-.5)+'e6',sp=460;const i0=Math.floor(par/sp)-1,i1=Math.ceil((par+S.vw)/sp)+1;
  for(let i=i0;i<=i1;i++){if(hash(i*3.1)<.35)continue;const x=i*sp+hash(i)*180-par,s=.75+hash(i+11)*.5;fgItem(c,k,x,base,s,i,col)}c.restore()}
 // brillos animados
 const sh=SHINE[w.id];if(sh&&!rm){c.save();c.globalCompositeOperation='lighter';if(sh==='agua'){for(let i=0;i<5;i++){c.fillStyle='rgba(200,250,255,.05)';c.beginPath();const x=(i*W/4+Math.sin(t*.4+i)*60);c.moveTo(x,0);c.lineTo(x+70,0);c.lineTo(x+220+Math.sin(t*.7+i)*40,H);c.lineTo(x+120,H);c.fill()}}
  for(let i=0;i<16;i++){const a=Math.pow(Math.max(0,Math.sin(t*1.6+i*2.3)),6);if(a<.05)continue;const x=hash(i+40)*W,y=hash(i+90)*H*.8,r=6+hash(i)*10,col=sh==='neon'?pick(['#ff5fe0','#5ff6ff']):sh==='hielo'?'#e6fbff':sh==='polvo'?'#ffe9a6':'#ffffff';c.globalAlpha=a;glow(c,x,y,r*3,col,.6);c.fillStyle=col;c.beginPath();c.moveTo(x,y-r);c.lineTo(x+r*.2,y-r*.2);c.lineTo(x+r,y);c.lineTo(x+r*.2,y+r*.2);c.lineTo(x,y+r);c.lineTo(x-r*.2,y+r*.2);c.lineTo(x-r,y);c.lineTo(x-r*.2,y-r*.2);c.fill()}c.restore();c.globalAlpha=1}
 // clima
 weatherFX(c,S.wx,t,rm);
 // luz del amanecer y del atardecer
 if(!w.night)tintFX(c);
 eventFX(c,t,rm)}
function tintFX(c){const d=new Date(),h=d.getHours()+d.getMinutes()/60;let col=null,a=0;if(h>=5&&h<8){col='255,150,140';a=.18*(1-Math.abs(h-6.5)/1.5)}else if(h>=17&&h<20){col='255,120,60';a=.22*(1-Math.abs(h-18.5)/1.5)}if(!col||a<=0)return;const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(.7,`rgba(${col},${a*.4})`);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,W,H)}
function weatherFX(c,wx,t,rm){if(!wx||wx==='despejado')return;const n=rm?.4:1;c.save();
 if(wx==='lluvia'||wx==='tormenta'){if(wx==='tormenta'){c.fillStyle='rgba(20,20,50,.16)';c.fillRect(0,0,W,H);if((t%7)<.12||((t+3.3)%9)<.08){c.fillStyle='rgba(255,255,255,.45)';c.fillRect(0,0,W,H)}}c.strokeStyle='rgba(200,225,255,.55)';c.lineWidth=1.6;c.beginPath();const m=Math.floor((wx==='tormenta'?140:80)*n);for(let i=0;i<m;i++){const x=((hash(i)*W*1.2-t*80)%(W*1.2)+W*1.2)%(W*1.2),y=(hash(i+7)*H+t*(700+hash(i)*300))%H;c.moveTo(x,y);c.lineTo(x-6,y+18)}c.stroke()}
 if(wx==='niebla')for(let i=0;i<5;i++){c.fillStyle='rgba(235,240,245,.14)';c.beginPath();c.ellipse((i*W/3+t*20*(i%2?1:-.6))%(W+600)-300,H*(.35+i*.12),360,46,0,0,7);c.fill()}
 if(wx==='viento'){c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=2;c.lineCap='round';for(let i=0;i<14*n;i++){const x=(hash(i)*W+t*(600+hash(i)*300))%(W+300)-150,y=hash(i+3)*H*.8;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+40,y-8,x+90,y);c.stroke()}}
 if(wx==='arcoiris'){c.lineWidth=14;c.globalAlpha=.28;['#ff4f6d','#ff9a3d','#ffe066','#5cc98a','#4fc3ff','#7c5cff'].forEach((col,i)=>{c.strokeStyle=col;c.beginPath();c.arc(W*.7,H*.62,H*.55-i*14,Math.PI*1.05,Math.PI*1.95);c.stroke()});c.globalAlpha=1}
 if(wx==='nevada'){c.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<70*n;i++){const y=(hash(i+5)*H+t*(40+hash(i)*50))%H,x=(hash(i)*W+Math.sin(t+i)*30)%W;c.beginPath();c.arc(x,y,1.5+hash(i+2)*2.5,0,7);c.fill()}}
 if(wx==='estrellas'){for(let i=0;i<4;i++){const p=((t*.5+hash(i)*3)%3)/3;if(p>.4)continue;const q=p/.4,x=hash(i+20)*W+q*260,y=hash(i+30)*H*.4+q*130;c.strokeStyle=`rgba(255,240,180,${1-q})`;c.lineWidth=3;c.beginPath();c.moveTo(x,y);c.lineTo(x-70,y-35);c.stroke()}}
 c.restore()}
function eventFX(c,t,rm){const ev=curEvent();if(!ev||rm)return;for(let i=0;i<16;i++){const x=(hash(i+60)*W+Math.sin(t*.6+i)*50+W)%W,y=((hash(i+61)*H)+t*(30+hash(i)*40))%(H+40)-20;c.globalAlpha=.85;shape(c,ev.fx,x,y,7+hash(i)*5,ev.cs[i%ev.cs.length],t+i)}c.globalAlpha=1}
const _hdraw=HUBS.draw;HUBS.draw=function(c){_hdraw.call(this,c);tintFX(c);eventFX(c,G.t,document.body.classList.contains('rm'))};

const _wup=WSC.update;WSC.update=function(dt){const g0=ST.stats.gems,p=this.pet;
 if(hasComp('magnet'))for(const g of this.gems)if(!g.got){const d=Math.hypot(g.x-p.x,g.y-(p.y-60));if(d<200){g.x=lerp(g.x,p.x,dt*3);g.y=lerp(g.y,p.y-60,dt*3)}}
 if(this.speedK>1&&Math.abs(p.vx)>10)p.x=clamp(p.x+p.vx*dt*(this.speedK-1),30,this.w.len-40);
 _wup.call(this,dt);const got=ST.stats.gems-g0;if(got>0){if(hasComp('gems'))addCoins(5*got);if(this.wx==='tormenta')addCoins(5*got)}};

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const weekId=(d=new Date())=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+'-S'+Math.ceil(((t-y)/864e5+1)/7)};

const CL={db:null,user:null,uid:null,on:false,writing:false,dirty:false,inbox:[],isl:{},names:{}};
async function initCloud(){if(!AUTH.ok||!AUTH.db||!AUTH.uid)return;const db=AUTH.db,id=AUTH.uid;CL.db=db;CL.uid=id;CL.user=AUTH.user;
 if(AUTH.mode==='local'){CL.on=true;CL.local=true;cloudBadge();publishIsland();listenInbox();listenTrades();checkWeekPrize();return}
 if(AUTH.mode==='claude'&&AUTH.user){try{if((await AUTH.user.can('data.write'))===false){CL.on=false;CL.ro=true;cloudBadge();return}}catch(e){}}
 try{const snap=await withTO(db.doc(`data/users/${id}/save`).get(),10000);
  if(snap&&snap.exists){const d=snap.data();if(d&&d.json&&(d.last>(ST.last||0)+4000||!ST.pets.length)){try{replaceST(JSON.parse(d.json));fixST();faceKey='';applyA11y();save();toast('Progreso recuperado de tu cuenta en la nube','gold');if(!$('#title').classList.contains('hide'))showTitle()}catch(e){logErr('nube: '+e)}}}
  CL.on=true;CL.dirty=true;cloudBadge();publishIsland();listenInbox();listenTrades();checkWeekPrize()}catch(e){CL.on=false;logErr('nube: '+(e&&(e.message||e.code)));cloudBadge()}}

/* ---------- catálogo: 64 pinceles (nombres propios de Mitopía) ---------- */
const BR=[];const B_=(id,n,cat,price,steps,spec)=>BR.push({id,n,cat,price,steps,...spec});
const basic=(id,n,col,txt)=>B_(id,n,'basico',140,[`Aplica una capa uniforme de ${txt} sobre todo el cuerpo.`,'Cubre por completo cualquier color o patrón anterior.','Conserva la forma y los rasgos de la criatura, sin añadir ropa ni accesorios.',`Resultado: una criatura de ${txt} uniforme.`],{c:solid(col)});
basic('rojo','Rojo','#f0413c','color rojo intenso');basic('amarillo','Amarillo','#ffd23f','color amarillo vivo');basic('azul','Azul','#3b82f6','color azul brillante');basic('verde','Verde','#3fb65a','color verde');
basic('morado','Morado','#8b4fd8','color morado intenso');basic('naranja','Naranja','#ff8a1f','color naranja brillante');basic('rosa','Rosa','#ff9ec4','color rosa suave');basic('marron','Marrón','#9a6236','color marrón');
B_('blanco','Blanco','basico',140,['Aplica una capa uniforme de blanco puro.','Elimina cualquier color o patrón anterior.','Conserva la forma original sin añadir nada.','Resultado: una criatura blanca, ideal como base.'],{c:['#ffffff','#f4f4ff','#dcdcea']});
B_('plateado','Plateado','basico',260,['Aplica un gris claro con brillo metálico.','Añade un reflejo plateado de metal pulido.','Mantiene la forma original: solo cambia color y acabado.','Resultado: una criatura de plata brillante.'],{c:['#c9d3e2','#eef3fa','#8a96aa'],pat:'metal',front:()=>DEC.brillos('#fff')});
B_('dorado','Dorado','basico',320,['Aplica un amarillo dorado con brillo metálico.','Añade un reflejo dorado de oro pulido.','Conserva la forma original: solo cambia color y acabado.','Resultado: una criatura de oro brillante y lujosa.'],{c:['#f2c230','#fff0a6','#b8860b'],pat:'metal',front:()=>DEC.brillos('#fff6c8')});
B_('gris','Gris','basico',140,['Aplica una capa uniforme de gris.','Cambia la expresión a una mirada triste.','Da un aspecto melancólico y apagado.','Resultado: una criatura gris con expresión triste.'],{c:['#9a9aa6','#c6c6cf','#6d6d78'],sad:true});
B_('sombra','Sombra','basico',360,['Oscurece todo el cuerpo a tonos casi negros.','Añade un aire sombrío y nocturno.','Hace que los ojos brillen en la oscuridad.','Resultado: una criatura oscura y misteriosa.'],{c:['#2e2a3a','#47415c','#1a1724'],eyes:'gato',eye:'#fff36a',back:()=>DEC.aura('rgba(60,40,110,.35)')});
['rojo','azul','verde','amarillo'].forEach(k=>{const b=BR.find(x=>x.id===k);B_('ini_'+k,'Inicial '+b.n.toLowerCase(),'inicio',60,[`Cumple la misma función que el pincel ${b.n}.`,'Aplica la misma capa de color sólido.','Solo cambia su precio: es más económico.',`Resultado: el mismo ${b.n.toLowerCase()} básico, a menor costo.`],{c:b.c,same:k})});
const P_=(id,n,price,steps,spec)=>B_(id,n,'patron',price,steps,spec);
P_('arcoiris','Arcoíris',520,['Divide el cuerpo en franjas de colores.','Aplica rojo, naranja, amarillo, verde, azul y morado.','Mezcla los tonos con transiciones suaves.','Resultado: una criatura cubierta de un arcoíris brillante.'],{c:['#ff8a8a','#fff3c4','#9b6cff'],pat:'arcoiris'});
P_('rayado','Rayado',300,['Aplica un color base uniforme.','Dibuja rayas de un segundo tono.','Alterna los dos tonos de forma regular.','Resultado: un patrón a rayas tipo cebra.'],{c:p=>[p.c1,shade(p.c1,.5),shade(p.c1,-.55)],pat:'cebra'});
P_('mitad','Mitad y mitad',300,['Divide a la criatura en dos mitades.','Pinta cada mitad de un color distinto.','Deja una línea clara en el centro.','Resultado: un efecto de dos colores contrastados.'],{c:['#4fc3ff','#ff6b9b','#2f8fd1'],pat:'mitad'});
P_('lunares','Lunares',280,['Aplica un color base uniforme.','Superpone lunares de un segundo color.','Reparte los lunares de forma regular.','Resultado: un patrón de lunares.'],{c:p=>[p.c1,'#ffffff',shade(p.c1,-.3)],pat:'lunar2'});
P_('cuadros','Cuadros',300,['Divide el cuerpo en una cuadrícula.','Alterna cuadros de dos colores, como un tablero.','Repite el patrón por toda la superficie.','Resultado: un aspecto de cuadros deportivo.'],{c:['#2b2b33','#ffffff','#1a1a22'],pat:'cuadros'});
P_('camuflaje','Camuflaje',320,['Aplica una base verde caqui.','Superpone manchas marrón, verde oscuro y beige.','Las manchas imitan el camuflaje.','Resultado: un aspecto de camuflaje.'],{c:['#8a9a5b','#b7c08a','#5a6a3a'],pat:'camuflaje'});
P_('salpicado','Salpicado',260,['Aplica una base verde claro.','Salpica puntos blancos de distintos tamaños.','Distribuye los puntos de forma natural.','Resultado: una textura moteada, como un huevo.'],{c:['#a8dc8a','#d8f2c6','#6ea85a'],pat:'salpicado'});
P_('manchado','Manchado',280,['Aplica una base clara crema.','Dibuja manchas grandes e irregulares oscuras.','Reparte las manchas como un dálmata.','Resultado: un aspecto de animal moteado.'],{c:['#fff4dc','#ffffff','#2f2420'],pat:'moteado'});
P_('brillante','Brillante',420,['Aplica un color neón verde.','Añade un resplandor alrededor del contorno.','La criatura emite brillo propio.','Resultado: un efecto fluorescente y luminoso.'],{c:['#9dff6a','#e6ffc8','#4fd13a'],fin:'glow',glow:'#b6ff7a'});
P_('electrico','Azul eléctrico',380,['Aplica un azul muy saturado.','Sube la intensidad hasta un acabado casi neón.','Da un aspecto de energía eléctrica.','Resultado: un azul eléctrico vibrante.'],{c:['#1f8bff','#9fdcff','#0a4ad6'],fin:'glow',glow:'#4fc3ff',front:()=>DEC.rayos()});
P_('invisible','Invisible',600,['Quita el color y el contorno del cuerpo.','La criatura queda casi transparente.','La ropa y los accesorios sí se ven.','Resultado: una criatura invisible, ideal para bromas.'],{fin:'invis'});
P_('nube','Nube',380,['Cambia la textura a una superficie algodonosa.','Aplica tonos blancos y celestes suaves.','Da un aspecto ligero y flotante.','Resultado: un cuerpo de nube suave y onírico.'],{c:['#ffffff','#e6f4ff','#bfe0ff'],pat:'nube',back:()=>DEC.nubes()});
P_('disco','Fiebre disco',440,['Aplica colores vivos: morado, rosa, naranja y verde.','Superpone estampados geométricos retro.','Da un acabado festivo y llamativo.','Resultado: un estilo disco lleno de energía.'],{c:['#b04fff','#ffd6ff','#7a1ad6'],pat:'disco',front:()=>DEC.brillos('#fff')});
P_('llamas','Llamas traviesas',460,['Aplica tonos rojos, naranjas y amarillos.','Dibuja lenguas de fuego sobre la superficie.','Da un aspecto ardiente y dinámico.','Resultado: una criatura que parece estar en llamas.'],{c:['#ff4a1a','#ffcf3f','#c22a0a'],pat:'lava',back:()=>DEC.llamas()});
P_('boceto','Boceto',400,['Convierte el cuerpo a blanco y negro.','Dibuja trazos de lápiz y sombreado.','Da un acabado de dibujo a medio terminar.','Resultado: un aspecto de dibujo a lápiz.'],{c:['#f6f6f2','#ffffff','#d0d0cc'],pat:'boceto',fin:'gris'});
P_('mofeta','Mofeta',300,['Aplica una base negra.','Dibuja una franja blanca por la espalda.','Añade el patrón de una mofeta.','Resultado: un aspecto de mofeta en blanco y negro.'],{c:['#2b2b33','#ffffff','#ffffff'],pat:'mofeta'});
P_('fresa','Campo de fresas',380,['Aplica tonos rojos.','Añade hojas verdes y semillitas.','Da una temática de fresa.','Resultado: una criatura dulce como una fresa.'],{c:['#ff4f5e','#ffd6dc','#d62a3a'],pat:'semillas',head:()=>DEC.hojasFresa(),hide:['cabeza']});
P_('estrellado','Estrellado',420,['Aplica una base azul oscuro.','Dibuja estrellitas brillantes.','Da un aspecto de cielo nocturno.','Resultado: una criatura de cielo estrellado.'],{c:['#1d2a6a','#3a4aa0','#0f1640'],pat:'estrellado'});

 const q={...p};const cs=typeof B.c==='function'?B.c(p):B.c;if(cs)[q.c1,q.c2,q.c3]=cs;q.pattern=B.pat||'liso';if(B.eyes)q.eyes=B.eyes;if(B.eye)q.eye=B.eye;if(B.baby){q.growth=0;q.size=(p.size||1)*.92}
 if(B.hide){q.acc={...(p.acc||{})};B.hide.forEach(s=>delete q.acc[s])}
 const oo={...o};if(B.sad&&(!o.expr||o.expr==='normal'))oo.expr='sad';const pose=o.pose||'stand';
 if(B.fin==='invis'){const base=_petSVG({...q,c1:'#ffffff',c2:'#ffffff',c3:'#ffffff',pattern:'liso'},{...oo,noAcc:true}),u='iv'+(++UID);const r=base.lastIndexOf('<g transform="translate(100 194) scale('),e=base.indexOf('>',r)+1;

 if(B.fin==='glow'){defs+=`<filter id="${u}f" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/><feFlood flood-color="${B.glow}" flood-opacity=".9"/><feComposite in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;attr=` filter="url(#${u}f)"`}
 if(B.fin==='ghost'){defs+=`<filter id="${u}f" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;attr=` filter="url(#${u}f)" opacity=".62"`}

 if(B.fin==='gris'){defs+=`<filter id="${u}f"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="1.15" intercept="-.05"/><feFuncG type="linear" slope="1.15" intercept="-.05"/><feFuncB type="linear" slope="1.15" intercept="-.05"/></feComponentTransfer></filter>`;attr=` filter="url(#${u}f)"`}
 if(B.fin==='oleo'){defs+=`<filter id="${u}f" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter>`;attr=` filter="url(#${u}f)"`}
 const back=B.back?`<g transform="${BTp[pose]||''}">${B.back()}</g>`:'';
 const front=(B.body?`<g transform="${BTp[pose]||''}">${B.body()}</g>`:'')+(B.head?`<g transform="${HTp[pose]||''}">${B.head()}</g>`:'')+(B.front?B.front():'');
 const r=svg.lastIndexOf('<g transform="translate(100 194) scale(');const e=svg.indexOf('>',r)+1;const end=svg.length-'</g></svg>'.length;
 const inner=svg.slice(e,end);
 const body=B.fin==='glass'?back+`<g${attr}>${inner}</g>`+front:`${back}<g${attr}>${inner}</g>${front}`;
 svg=svg.slice(0,e)+body+'</g></svg>';if(defs)svg=svg.replace('</defs>',defs+'</defs>');return svg};

  if(TREE.n>=4)puff(x,y,TREE.n>=8?'star':'spark',4+TREE.n,{cs:['#ff4f6d','#ffb03a','#ffe066','#5cc98a','#4fc3ff','#9b6cff'],sp:120+TREE.n*16,up:40,g:60,s:8});

  if(TREE.n>1)return}
 _hd.call(this,sx,sy)};

/* ---------- cliente REST que imita la base de datos (modo servidor) ---------- */
function restDB(base){const api=async(m,u,b)=>{const r=await fetch(base+u,{method:m,credentials:'same-origin',headers:b?{'content-type':'application/json'}:{},body:b?JSON.stringify(b):undefined});if(!r.ok){let j={};try{j=await r.json()}catch(e){}const er=new Error(j.detail||r.statusText);er.code=r.status===403?'permission-denied':r.status===401?'unauthenticated':'error';throw er}return r.status===204?null:r.json()};
 const snap=(path,d)=>({id:path.split('/').pop(),exists:!!d,data:()=>d||undefined,ref:{path}});
 const doc=path=>({path,id:path.split('/').pop(),get:async()=>snap(path,(await api('GET','/doc?path='+encodeURIComponent(path))).data),set:(data,o)=>api('PUT','/doc',{path,data,merge:!!(o&&o.merge)}),update:data=>api('PUT','/doc',{path,data,merge:true}),delete:()=>api('DELETE','/doc?path='+encodeURIComponent(path)),
  onSnapshot(cb,err){let last='';const tick=async()=>{try{const s=await this.get();const k=JSON.stringify(s.data());if(k!==last){last=k;cb(s)}}catch(e){err&&err(e)}};tick();const iv=setInterval(tick,8000);return()=>clearInterval(iv)}});
 const query=(coll,q={where:[],order:null,lim:0})=>({where:(f,op,v)=>query(coll,{...q,where:[...q.where,[f,op,v]]}),orderBy:(f,dir='asc')=>query(coll,{...q,order:[f,dir]}),limit:n=>query(coll,{...q,lim:n}),
  get:async()=>{const r=await api('POST','/query',{coll,where:q.where,order:q.order,limit:q.lim});const docs=r.docs.map(d=>snap(coll+'/'+d.id,d.data));return{docs,size:docs.length,empty:!docs.length}},
  onSnapshot(cb,err){let last='';const tick=async()=>{try{const s=await this.get();const k=JSON.stringify(s.docs.map(d=>[d.id,d.data()]));if(k!==last){last=k;cb(s)}}catch(e){err&&err(e)}};tick();const iv=setInterval(tick,8000);return()=>clearInterval(iv)},
  add:async data=>{const r=await api('POST','/add',{coll,data});return doc(coll+'/'+r.id)},doc:id=>doc(coll+'/'+id)});
 return{doc,collection:c=>query(c),api}}

 const priv=p=>p.startsWith('data/users/');const snap=(p,d)=>({id:p.split('/').pop(),exists:d!==undefined,data:()=>d===undefined?undefined:JSON.parse(JSON.stringify(d))});
 const doc=p=>({id:p.split('/').pop(),path:p,get:async()=>snap(p,priv(p)?undefined:LS()[p]),set:async d=>{if(priv(p))return;const D=LS();D[p]=d;SV(D)},update:async d=>{const D=LS();if(!D[p]){const e=new Error('no existe');e.code='not-found';throw e}D[p]={...D[p],...d};SV(D)},delete:async()=>{const D=LS();delete D[p];SV(D)},
  onSnapshot(cb){let l=null;const t=()=>{const d=LS()[p],k=JSON.stringify(d);if(k!==l){l=k;cb(snap(p,d))}};t();const iv=setInterval(t,1500);return()=>clearInterval(iv)}});
 const coll=(c,q={w:[],o:null,l:0})=>({where:(f,op,v)=>coll(c,{...q,w:[...q.w,[f,v]]}),orderBy:(f,d)=>coll(c,{...q,o:[f,d]}),limit:n=>coll(c,{...q,l:n}),doc:id=>doc(c+'/'+id),
  get:async()=>{const D=LS(),n=c.split('/').length+1;let ds=Object.keys(D).filter(k=>k.startsWith(c+'/')&&k.split('/').length===n).map(k=>snap(k,D[k])).filter(s=>q.w.every(([f,v])=>s.data()[f]===v));if(q.o)ds.sort((a,b)=>((a.data()[q.o[0]]||0)>(b.data()[q.o[0]]||0)?1:-1)*(q.o[1]==='desc'?-1:1));if(q.l)ds=ds.slice(0,q.l);return{docs:ds,size:ds.length,empty:!ds.length}},
  add:async d=>{const id='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);const D=LS();D[c+'/'+id]=d;SV(D);return doc(c+'/'+id)},
  onSnapshot(cb){let l=null;const self=this;const t=async()=>{const s=await self.get();const k=JSON.stringify(s.docs.map(x=>[x.id,x.data()]));if(k!==l){l=k;cb(s)}};t();const iv=setInterval(t,1500);return()=>clearInterval(iv)}});

  async jugadores(){const P=await admPlayers();ADM.P=P;const q=(ADM.q||'').toLowerCase();const L=P.filter(p=>!q||[p.nick,p.email,p.pet,p.name].join(' ').toLowerCase().includes(q));
   C().innerHTML=`<input class="txt" id="admQ" placeholder="Buscar por nombre, correo o criatura" value="${esc(ADM.q||'')}"><div class="admlist">${L.map(p=>`<div class="admrow ${p.banned?'ban':''}"><div><b>${esc(p.nick||'(sin registro)')}</b> ${p.banned?'<span class="pill red">Suspendida</span>':''}<small>${esc(p.email||(p.local?'cuenta de este dispositivo':'correo no disponible'))} · criatura: ${esc(p.pet||'—')} · nivel ${p.lv||'—'}</small><small>Alta: ${fmtD(p.creado)} · Última visita: ${fmtD(p.visto)}</small>${p.msg?`<small>Mensaje: «${esc(p.msg)}»</small>`:''}</div><div class="row">${p.isla?`<button class="btn sm" data-av="${p.id}">Ver isla</button>`:''}<button class="btn sm" data-ag="${p.id}">Regalar monedas</button>${p.id===AUTH.uid?'':`<button class="btn sm ${p.banned?'':'danger'}" data-ab="${p.id}" data-on="${p.banned?0:1}">${p.banned?'Quitar suspensión':'Suspender'}</button>`}${p.isla?`<button class="btn sm" data-ai="${p.id}">Borrar isla</button>`:''}${p.ws!=null?`<button class="btn sm" data-ar="${p.id}">Borrar récords</button>`:''}${p.local&&p.id!==AUTH.uid?`<button class="btn sm" data-apw="${p.id}">Nueva contraseña</button><button class="btn sm danger" data-adel="${p.id}">Borrar cuenta</button>`:''}</div></div>`).join('')||'<p class="note">No hay cuentas que coincidan.</p>'}</div>`;
   const qi=$('#admQ');qi.oninput=()=>{ADM.q=qi.value;clearTimeout(ADM.qt);ADM.qt=setTimeout(()=>R.jugadores().then(()=>{const n=$('#admQ');n.focus();n.setSelectionRange(n.value.length,n.value.length)}),350)}},
  async moderacion(){const[G2,T2,I]=await Promise.all([admList('regalos',300),admList('trueques',300),admList('islas',1000)]);
   C().innerHTML=`<h4>Mensajes de islas</h4>${I.filter(i=>i.msg).map(i=>`<div class="admrow"><div><b>${esc(i.pet&&i.pet.name||'')}</b><small>«${esc(i.msg)}»</small></div><button class="btn sm danger" data-am="${i.id}">Borrar mensaje</button></div>`).join('')||'<p class="note">No hay mensajes.</p>'}
   <h4>Regalos pendientes (${G2.length})</h4>${G2.slice(0,100).map(g=>`<div class="admrow"><div><b>${g.k==='coins'?g.v+' monedas':esc(g.k==='food'?(FOODS[g.v]||{}).n:(ACC_BY[g.v]||{}).name)}</b><small>De ${esc(g.fromPet||'')} · ${fmtD(g.at)}${g.nota?` · «${esc(g.nota)}»`:''}</small></div><button class="btn sm danger" data-dg="${g.id}">Eliminar</button></div>`).join('')||'<p class="note">Sin regalos pendientes.</p>'}
   <h4>Intercambios (${T2.length})</h4>${T2.slice(0,100).map(t=>`<div class="admrow"><div><b>${esc((ACC_BY[t.give]||{}).name||t.give)} → ${esc((ACC_BY[t.want]||{}).name||t.want)}</b><small>${esc(t.fromPet||'')} · ${esc(t.st)} · ${fmtD(t.at)}</small></div><button class="btn sm danger" data-dt="${t.id}">Eliminar</button></div>`).join('')||'<p class="note">Sin intercambios.</p>'}
   <p class="note">Al eliminar un intercambio abierto, el accesorio no regresa automáticamente a quien lo ofreció: regálale el accesorio o monedas si hace falta.</p>`},
  mundo(){const c=AUTH.cfg;C().innerHTML=`<p class="note">Estos ajustes llegan a todas las personas en unos segundos.</p>
   <h4>Aviso para todos</h4><textarea class="txt" id="cfA" rows="2" maxlength="160" placeholder="Por ejemplo: ¡Este fin de semana monedas dobles!">${esc(c.anuncio)}</textarea>
   <h4>Evento de temporada</h4><select class="txt" id="cfE"><option value="auto">Automático por fecha</option><option value="ninguno">Ninguno</option>${EVENTS.map(e=>`<option value="${e.id}" ${c.evento===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select>
   <h4>Multiplicadores</h4><div class="row"><label>Monedas <select class="txt" id="cfM">${[1,1.5,2,3].map(v=>`<option ${c.monedasX==v?'selected':''}>${v}</option>`).join('')}</select></label><label>Experiencia <select class="txt" id="cfX">${[1,1.5,2,3].map(v=>`<option ${c.xpX==v?'selected':''}>${v}</option>`).join('')}</select></label></div>
   <h4>Torneo semanal</h4><select class="txt" id="cfT"><option value="auto">Automático (cambia cada semana)</option>${WORLDS.map(w=>`<option value="${w.game.id}" ${c.torneo===w.game.id?'selected':''}>${esc(w.game.name)}</option>`).join('')}</select>
   <h4>Funciones</h4><div class="chips col">${[['visitas','Visitas a islas'],['regalos','Regalos'],['intercambios','Intercambios'],['clasificacion','Clasificación general']].map(([k,n])=>`<label class="chk"><input type="checkbox" data-cf="${k}" ${c.func[k]?'checked':''}> ${n}</label>`).join('')}</div>
   <h4>Mantenimiento</h4><label class="chk"><input type="checkbox" id="cfMt" ${c.mantenimiento?'checked':''}> Cerrar Mitopía para todos menos para ti</label><input class="txt" id="cfMm" maxlength="140" value="${esc(c.mantMsg)}">
   <div class="row mt"><button class="btn pri" data-cfg="save">Publicar cambios</button></div>`},
  partida(){C().innerHTML=`<p class="note">Herramientas del creador: afectan solo a tu partida.</p><div class="admgrid">${[['c1k','+1,000 monedas'],['c10k','+10,000 monedas'],['lv','Subir 5 niveles'],['need','Necesidades al 100'],['acc','Desbloquear los 628 accesorios'],['comp','Todas las mascotitas'],['furn','Todos los muebles'],['quest','Cumplir todas las misiones de mundo'],['story','Completar todas las historias'],['bebe','Etapa: bebé'],['joven','Etapa: joven'],['adulto','Etapa: adulta'],['mis','Completar misiones de hoy'],['tut','Reiniciar tutorial'],['brush','Un pincel de cada tipo'],['pool','Abrir la Piscina Arcoíris'],['fps','Mostrar u ocultar FPS'],['conf','Probar celebración']].map(([k,n])=>`<button class="btn" data-ap="${k}">${n}</button>`).join('')}</div>
   <h4>Viajar a</h4><select class="txt" id="apW">${WORLDS.map((w,i)=>`<option value="${i}">${esc(w.name)}</option>`).join('')}</select><div class="row"><button class="btn sm" data-ap="ir">Ir al mundo</button><button class="btn sm" data-ap="jugar">Abrir su minijuego</button></div>`},
  async diag(){const fps=await measureFPS();let bytes=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);bytes+=(localStorage.getItem(k)||'').length*2}}catch(e){}
   C().innerHTML=`<div class="kpis">${[['Versión',APP_VER],['Cuentas',AUTH.mode==='server'?'Servidor propio':AUTH.mode==='local'?'Este dispositivo':'Claude'],['Guardado',CL.local?'Este dispositivo':CL.on?'Nube activa':CL.ro?'Solo lectura':'Local'],['FPS ahora',fps],['Pantalla',`${innerWidth}×${innerHeight} @${DPR}x`],['Escena',SC?SC.name:'—'],['Imágenes en memoria',IMG.size],['Almacenamiento local',Math.round(bytes/1024)+' KB']].map(([k,v])=>`<div class="kpi"><b>${esc(String(v))}</b><span>${k}</span></div>`).join('')}</div>
   <h4>Errores registrados (${ERRLOG.length})</h4>${ERRLOG.length?`<div class="errlog">${ERRLOG.map(e=>`<div><small>${fmtD(e.t)}</small> ${esc(e.m)}</div>`).join('')}</div><button class="btn sm" data-dx="clr">Vaciar lista</button>`:'<p class="note">Sin errores en esta sesión.</p>'}
   <h4>Datos</h4><div class="row"><button class="btn" data-dx="exp">Exportar base de datos (JSON)</button><button class="btn" data-dx="img">Liberar memoria de imágenes</button></div><p class="note">Identificador de tu cuenta: <code>${esc(AUTH.uid||'')}</code></p>`}};
 const show=async t=>{ADM.tab=t;$$('#admT button').forEach(b=>b.classList.toggle('on',b.dataset.at===t));C().innerHTML='<p class="note">Cargando…</p>';try{await R[t]()}catch(e){C().innerHTML='<p class="note">No se pudo cargar esta sección.</p>';logErr('admin: '+e)}};show(ADM.tab);
 body.onclick=async e=>{const b=e.target.closest('button');if(!b)return;AU.sfx('tap');const d=b.dataset,db=AUTH.db;
  const run=async(fn,ok)=>{busy(b,true);try{await fn();ok&&toast(ok,'gold')}catch(err){toast('No se pudo: '+(err.message||err.code||'error'));logErr('admin acción: '+(err.message||err.code))}busy(b,false)};
  if(d.at)return show(d.at);
  if(d.av){const s=await db.doc('islas/'+d.av).get();if(s.exists){CL.isl[d.av]=s.data();visitIsland(d.av)}return}
  if(d.ag){const row=b.closest('.admrow');if(!row.querySelector('.gbox')){row.insertAdjacentHTML('beforeend',`<div class="gbox row"><input class="txt" type="number" min="1" max="100000" value="100" aria-label="Monedas"><input class="txt" maxlength="60" placeholder="Nota (opcional)" aria-label="Nota"><button class="btn sm pri" data-ags="${d.ag}">Enviar</button></div>`)}return}
  if(d.ags){const box=b.closest('.gbox'),[ni,ti]=box.querySelectorAll('input'),n=parseInt(ni.value,10);if(!(n>0&&n<=100000))return toast('Escribe una cantidad de 1 a 100,000.');return run(()=>admGift(d.ags,n,ti.value.trim()||'Regalo del equipo de Mitopía'),'Regalo enviado').then(()=>box.remove())}
  if(d.ab){const on=d.on==='1';if(on&&!sure(b))return;return run(()=>admBan(d.ab,on),on?'Cuenta suspendida':'Suspensión retirada').then(()=>show('jugadores'))}
  if(d.apw){const row=b.closest('.admrow');if(!row.querySelector('.gbox'))row.insertAdjacentHTML('beforeend',`<div class="gbox row"><input class="txt" type="text" minlength="4" placeholder="Nueva contraseña (mínimo 4)" aria-label="Nueva contraseña"><button class="btn sm pri" data-apws="${d.apw}">Guardar</button></div>`);return}
  if(d.apws){const v=b.closest('.gbox').querySelector('input').value;if(v.length<4)return toast('Mínimo 4 caracteres.');const C=cuentas(),c=C[d.apws];if(!c)return;c.salt=Math.random().toString(36).slice(2)+Date.now().toString(36);c.hash=pwHash(c.uid,v,c.salt);saveCuentas(C);toast(`Contraseña de ${c.nick} cambiada`,'gold');b.closest('.gbox').remove();return}
  if(d.adel){if(!sure(b))return;const C=cuentas();delete C[d.adel];saveCuentas(C);try{localStorage.removeItem('mitopia_v1:'+d.adel);localStorage.removeItem('mitopia_fotos:'+d.adel)}catch(e){}for(const c of['jugadores','islas','records','bans'])await db.doc(c+'/'+d.adel).delete().catch(()=>{});toast('Cuenta borrada','gold');return show('jugadores')}
  if(d.ai){if(!sure(b))return;return run(()=>db.doc('islas/'+d.ai).delete(),'Isla borrada').then(()=>show('jugadores'))}
  if(d.ar){if(!sure(b))return;return run(()=>db.doc('records/'+d.ar).delete(),'Récords borrados').then(()=>show('jugadores'))}
  if(d.am)return run(()=>db.doc('islas/'+d.am).update({msg:''}),'Mensaje borrado').then(()=>show('moderacion'));
  if(d.dg)return run(()=>db.doc('regalos/'+d.dg).delete(),'Regalo eliminado').then(()=>show('moderacion'));
  if(d.dt)return run(()=>db.doc('trueques/'+d.dt).delete(),'Intercambio eliminado').then(()=>show('moderacion'));
  if(d.cfg){const func={};$$('[data-cf]').forEach(x=>func[x.dataset.cf]=x.checked);const c={anuncio:$('#cfA').value.trim().slice(0,160),evento:$('#cfE').value,monedasX:+$('#cfM').value,xpX:+$('#cfX').value,torneo:$('#cfT').value,func,mantenimiento:$('#cfMt').checked,mantMsg:$('#cfMm').value.trim().slice(0,140)||CFG_DEF.mantMsg,por:AUTH.uid,at:Date.now()};
   return run(()=>db.doc('config/global').set(c),'Cambios publicados para todos').then(()=>{sessionStorage.removeItem('mitopia_anuncio');applyCfg(c)})}
  if(d.ap){const p=PET(),k=d.ap;
   if(k==='c1k')addCoins(1000);if(k==='c10k')addCoins(10000);if(k==='lv'){ST.level+=5;ST.xp=0}if(k==='need'&&p)for(const n in p.needs)p.needs[n]=100;
   if(k==='acc')ST.owned=[...new Set([...ST.owned,...ACC.map(a=>a.id)])];if(k==='comp')ST.comps=COMP.map(c=>c.id);if(k==='furn')ST.decor.owned=[...new Set([...ST.decor.owned,...WALLS.map(w=>w[0]),...FLOORS.map(f=>f[0]),...FURN.map(f=>f[0])])];
   if(k==='quest')WORLDS.forEach(w=>{const s=WS(w.id);if(!s.quest){s.quest=true;s.ch=Math.max(s.ch||0,1);const a=ACC.find(x=>x.quest===w.id);if(a&&!ST.owned.includes(a.id))ST.owned.push(a.id)}});
   if(k==='story')WORLDS.forEach(w=>{const s=WS(w.id);s.quest=true;s.ch=4});
   if(p&&k==='bebe')p.growth=0;if(p&&k==='joven')p.growth=100;if(p&&k==='adulto')p.growth=999;
   if(k==='mis'){const M=missions();M.d.forEach(m=>{ST.md.base[m.k]=(ST.md.base[m.k]||0)-m.n})}
   if(k==='brush')BR.forEach(b=>giveBrush(b.id,1,true));if(k==='pool'){closePanel();openPool();return}if(k==='tut'){ST.cfg.tut=0}if(k==='fps')toggleFPS();if(k==='conf')celebrate(true);
   if(k==='ir'){closePanel();enterWorld(+$('#apW').value);return}if(k==='jugar'){closePanel();startGame(WORLDS[+$('#apW').value].game.id);return}
   faceKey='';save();updHUD();toast('Hecho','gold');return}
  if(d.dx==='clr'){ERRLOG.length=0;return show('diag')}
  if(d.dx==='img'){IMG.clear();faceKey='';return show('diag')}
  if(d.dx==='exp')return run(async()=>{const out={exportado:new Date().toISOString(),version:APP_VER};for(const c of['jugadores','islas','records','regalos','trueques','bans','config'])out[c]=await admList(c,5000);if(AUTH.mode==='server'){try{out.cuentas=(await AUTH.db.api('GET','/admin/jugadores')).jugadores}catch(e){}}if(AUTH.mode==='local')out.cuentas=Object.values(cuentas()).map(c=>({uid:c.uid,nick:c.nick,creado:c.creado}));
   await saveFile('mitopia-base-'+today()+'.json',JSON.stringify(out,null,1))},'Exportación lista')}}
let fpsOn=false,fpsEl=null;function toggleFPS(){fpsOn=!fpsOn;if(!fpsEl){fpsEl=document.createElement('div');fpsEl.id='fps';document.body.appendChild(fpsEl)}fpsEl.classList.toggle('hide',!fpsOn);if(fpsOn){let n=0,t0=performance.now();const f=()=>{if(!fpsOn)return;n++;const t=performance.now();if(t-t0>=500){fpsEl.textContent=Math.round(n*1000/(t-t0))+' FPS';n=0;t0=t}requestAnimationFrame(f)};f()}}

(async()=>{const set=(p,t)=>{const b=$('#ldb');if(b)b.style.width=p+'%';if(t&&$('#ldt'))$('#ldt').textContent=t};set(25);
 try{await withTO(document.fonts.ready,2200)}catch(e){}set(55,'Coloreando las islas…');
 await sleep(30);try{if(typeof GL!=='undefined'&&!GL.ok)buildGlobeTex()}catch(e){logErr(e)}
 set(100,'¡Listo!');const l=$('#loader');l.classList.add('out');setTimeout(()=>l.remove(),700);
 await authGate();
 const ims=[];if(PET())['normal','happy','blink'].forEach(e=>[0,1].forEach(f=>ims.push(petImg(PET(),e,false,f,'stand'))));
 await withTO(Promise.all(ims.map(im=>im.decode?im.decode().catch(()=>{}):0)),2000);
 showTitle();requestAnimationFrame(loop);initCloud()})();
