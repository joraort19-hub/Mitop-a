<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Mitop-a — Sala de bots con IA que conversan, juegan, buscan en Wikipedia y mucho más." />
<title>Mitop-a · Sala de Bots</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" />
</head>
<body data-theme="dark" data-accent="blue">

<header class="topbar">
  <div class="brand">
    <span class="brand-logo">🤖</span>
    <div>
      <h1>Mitop<span>-a</span></h1>
      <p class="sub">Sala de bots inteligentes · conversan, juegan y aprenden contigo</p>
    </div>
    <span class="live-dot" title="Bots en línea"></span>
  </div>
  <div class="topbar-actions">
    <button id="autoBtn" class="chip-btn" title="Los bots conversan entre sí">🎭 Charla entre bots</button>
    <button id="voiceBtn" class="icon-btn" title="Leer respuestas en voz alta">🔇</button>
    <button id="themeBtn" class="icon-btn" title="Cambiar tema claro/oscuro">🌙</button>
    <button id="settingsBtn" class="icon-btn" title="Ajustes">⚙️</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-head">Bots en línea <span id="botCount"></span></div>
    <div id="botList"></div>
    <div class="sidebar-foot">
      <button id="clearAllBtn" class="ghost-btn small">🗑 Borrar memoria</button>
    </div>
  </aside>

  <main class="chat-main">
    <div class="chat-head">
      <div class="chat-head-avatar" id="headAvatar">🤖</div>
      <div class="chat-head-meta">
        <div class="chat-head-name" id="headName">Nova</div>
        <div class="chat-head-desc" id="headDesc">Asistente general</div>
      </div>
      <div class="chat-head-actions">
        <button id="exportBtn" class="ghost-btn small" title="Descargar la conversación">⬇ Exportar</button>
      </div>
    </div>

    <div id="chat" class="chat"></div>

    <div class="suggestions" id="suggestions"></div>

    <div class="inputbar">
      <button id="micBtn" class="icon-btn" title="Dictar por voz">🎤</button>
      <textarea id="input" rows="1" placeholder="Escribe un mensaje… (Enter para enviar, / para comandos)"></textarea>
      <button id="sendBtn" class="primary-btn">Enviar</button>
    </div>
  </main>
</div>

<!-- Modal de ajustes -->
<div id="settingsModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h2>⚙️ Ajustes</h2>
      <button id="closeSettings" class="icon-btn">✕</button>
    </div>
    <div class="modal-body">
      <label class="field">
        <span>Tema</span>
        <select id="themeSelect">
          <option value="dark">Oscuro</option>
          <option value="light">Claro</option>
        </select>
      </label>
      <label class="field">
        <span>Color de acento</span>
        <select id="accentSelect">
          <option value="blue">Azul</option>
          <option value="purple">Morado</option>
          <option value="green">Verde</option>
          <option value="pink">Rosa</option>
          <option value="orange">Naranja</option>
        </select>
      </label>
      <label class="field">
        <span>Idioma de respuestas</span>
        <select id="langSelect">
          <option value="es">Español</option>
          <option value="en">English</option>
        </select>
      </label>
      <label class="field checkbox">
        <input type="checkbox" id="voiceAuto" />
        <span>Leer respuestas en voz alta automáticamente</span>
      </label>
      <button id="resetAllBtn" class="danger-btn small">🗑 Reiniciar todo (borrar memoria e historial)</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
